<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc" lang="en">
  <title id="title" data-preview-key="polish.title">Polish-input interface preview</title>
  <desc id="desc" data-preview-key="polish.description">Illustrated editor with selected text, a shared Translate and Polish toolbar, and a polished preview with Apply and Copy. Example content.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eae7f2"/><stop offset="1" stop-color="#e0e7ec"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#3d3b58" flood-opacity=".14"/></filter></defs>
  <rect width="1160" height="720" fill="url(#bg)"/><circle cx="1070" cy="80" r="230" fill="#faf6ff" opacity=".5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g filter="url(#shadow)"><rect x="64" y="63" width="1032" height="568" rx="18" fill="#fffefa"/><path d="M64 110h1032" stroke="#e5e1ec"/><circle cx="91" cy="87" r="5" fill="#d4cbdc"/><circle cx="110" cy="87" r="5" fill="#d4cbdc"/><circle cx="129" cy="87" r="5" fill="#d4cbdc"/></g>
    <text x="174" y="94" font-size="15" fill="#7a7186" data-preview-key="polish.editorTitle" data-preview-width="830">A note to a colleague</text>
    <rect x="96" y="148" width="904" height="99" rx="10" fill="#fff" stroke="#d7d1e1"/>
    <rect x="106" y="158" width="884" height="79" rx="5" fill="#dfdcfa"/>
    <text x="124" y="189" font-size="21" fill="#383345" data-preview-key="polish.draft" data-preview-width="844" data-preview-lines="2" data-preview-line-height="31">I finished update. Please check it.</text>
    <g filter="url(#shadow)"><rect x="687" y="254" width="346" height="51" rx="15" fill="#fff" stroke="#d5cfe0"/></g>
    <text x="706" y="286" font-size="15" fill="#635d77" data-preview-key="polish.translate" data-preview-width="140">Translate</text><path d="M853 264v31" stroke="#e0dce9"/>
    <text x="869" y="286" font-size="15" font-weight="600" fill="#584389" data-preview-key="polish.polish" data-preview-width="144">Polish</text>
    <g filter="url(#shadow)"><rect x="173" y="329" width="858" height="252" rx="18" fill="#fff" stroke="#e4deed"/></g>
    <text x="201" y="365" font-size="17" font-weight="600" fill="#51436d" data-preview-key="polish.resultLabel" data-preview-width="760">Polished text</text>
    <text x="201" y="409" font-size="21" fill="#40384e" data-preview-key="polish.result" data-preview-width="790" data-preview-lines="3" data-preview-line-height="31">I’ve completed the update. Please take a look when you have a chance.</text>
    <text x="201" y="518" font-size="13" fill="#82768f" data-preview-key="polish.hint" data-preview-width="520" data-preview-lines="2">Apply replaces your selection in supported editors. Copy is also available.</text>
    <rect x="759" y="503" width="111" height="42" rx="8" fill="#f4f1f8" stroke="#e1dbe9"/><text x="773" y="530" font-size="15" fill="#655773" data-preview-key="polish.copy" data-preview-width="83">Copy</text>
    <rect x="887" y="503" width="115" height="42" rx="8" fill="#65508e"/><text x="903" y="530" font-size="15" fill="#fff" data-preview-key="polish.apply" data-preview-width="83">Apply</text>
    <text x="65" y="680" font-size="12" letter-spacing="2" fill="#7b6f88" data-preview-key="polish.instruction" data-preview-width="700">SELECT. POLISH. REVIEW. APPLY.</text>
    <text x="803" y="680" font-size="11" fill="#91849c" data-preview-key="translation.previewLabel" data-preview-width="290">INTERFACE PREVIEW · EXAMPLE CONTENT</text>
  </g>
</svg>
